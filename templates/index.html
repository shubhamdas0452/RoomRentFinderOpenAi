<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StaySmart AI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>StaySmart AI</h1>

        <p class="tagline">
            Find the right place, not just a place.
        </p>

        <div class="search-box">

            <label>Maximum Budget</label>

            <input
                type="number"
                id="budget"
                placeholder="Example: 8000"
            >

            <label>Room Type</label>

            <select id="room">

                <option value="single">
                    Single
                </option>

                <option value="double">
                    Double
                </option>

            </select>

            <label>
                <input type="checkbox" id="food">
                Food Required
            </label>

            <label>
                <input type="checkbox" id="wifi">
                Wi-Fi Required
            </label>

            <button onclick="searchPG()">
                Find My PG
            </button>

        </div>

        <h2>Recommended PGs</h2>

        <div id="results"></div>

    </div>

    <script>

        async function searchPG() {

            const budget =
                Number(document.getElementById("budget").value);

            const room =
                document.getElementById("room").value;

            const food =
                document.getElementById("food").checked;

            const wifi =
                document.getElementById("wifi").checked;


            const response = await fetch("/api/search", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    budget: budget,
                    room: room,
                    food: food,
                    wifi: wifi

                })

            });


            const results =
                await response.json();


            const resultBox =
                document.getElementById("results");


            resultBox.innerHTML = "";


            if (results.length === 0) {

                resultBox.innerHTML =
                    "<p>No matching PG found.</p>";

                return;
            }


            results.forEach(pg => {

                resultBox.innerHTML += `

                    <div class="pg-card">

                        <h3>${pg.name}</h3>

                        <p>
                            Rent: ₹${pg.rent}
                        </p>

                        <p>
                            Room: ${pg.room}
                        </p>

                        <p>
                            Food:
                            ${pg.food ? "Available" : "Not Available"}
                        </p>

                        <p>
                            Wi-Fi:
                            ${pg.wifi ? "Available" : "Not Available"}
                        </p>

                        <p>
                            Distance: ${pg.distance} km
                        </p>

                    </div>

                `;

            });

        }

    </script>

</body>

</html>
